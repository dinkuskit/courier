name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run, which no one waits on any more.
# Pushes to main each get their own group and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck='' -pyflakes=''

  courier:
    name: Courier on EmDash ${{ matrix.emdash }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 1.5.0 is what stores run today; 1.6.0 is the lockfile's version. Each EmDash
        # has its own Registry sandbox runner for Node, pinned to that exact EmDash.
        include:
          - emdash: "1.5.0"
            sandbox: "0.9.7"
          - emdash: "1.6.0"
            sandbox: "0.9.8"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use EmDash ${{ matrix.emdash }}
        if: matrix.emdash != '1.6.0'
        env:
          EMDASH_VERSION: ${{ matrix.emdash }}
          SANDBOX_VERSION: ${{ matrix.sandbox }}
        run: npm install --no-save --ignore-scripts --no-audit --no-fund "emdash@$EMDASH_VERSION" "@emdash-cms/sandbox-workerd@$SANDBOX_VERSION"
      # Scripts are off for every package, so put workerd's own binary in place from the
      # platform package npm already installed. The Registry sandbox proof runs on it.
      - run: node node_modules/workerd/install.js
      - run: npm run typecheck
      - run: npm test
